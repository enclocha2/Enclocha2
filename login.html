<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff3d7f" />
  <title>Granizados · Ingresar</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-bg">
  <form class="login card" id="form" autocomplete="on">
    <div style="font-size:3rem;text-align:center">🍧</div>
    <h1>Granizados</h1>
    <p class="hint" style="text-align:center;margin-top:-6px">¿Quién está atendiendo?</p>

    <div class="users" id="users">
      <button type="button" class="opt" data-u="Stiv"><strong>Stiv</strong></button>
      <button type="button" class="opt" data-u="Angel"><strong>Angel</strong></button>
      <button type="button" class="opt" data-u="John"><strong>John</strong></button>
      <button type="button" class="opt" data-u="Fofi"><strong>Fofi</strong></button>
    </div>

    <input class="field" id="usuario" name="username" placeholder="Usuario" autocomplete="username" required />
    <input class="field" id="clave" name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required />
    <div class="error" id="error"></div>
    <button class="btn" id="entrar">Entrar</button>
  </form>

  <script type="module">
    const $ = (s) => document.querySelector(s);
    const next = new URLSearchParams(location.search).get('next') || '/';
    const destino = next.startsWith('/') && !next.startsWith('//') ? next : '/';

    // Si ya hay sesión, pasar directo
    fetch('/api/login', { cache: 'no-store' }).then((r) => { if (r.ok) location.replace(destino); });

    $('#users').addEventListener('click', (e) => {
      const b = e.target.closest('[data-u]');
      if (!b) return;
      document.querySelectorAll('#users .opt').forEach((x) => x.classList.toggle('on', x === b));
      $('#usuario').value = b.dataset.u;
      $('#clave').focus();
    });

    $('#form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#entrar').disabled = true; $('#entrar').textContent = 'Entrando...'; $('#error').textContent = '';
      try {
        const r = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: $('#usuario').value, clave: $('#clave').value }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error);
        location.replace(destino);
      } catch (err) {
        $('#error').textContent = err.message || 'No se pudo entrar';
        $('#clave').value = ''; $('#clave').focus();
        $('#entrar').disabled = false; $('#entrar').textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
