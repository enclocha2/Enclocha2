<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a0b2e" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/img/icon-64.png" />
  <link rel="apple-touch-icon" href="/img/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Enclocha 2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" />
  <title>Enclocha 2 · Pedidos</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body style="visibility:hidden">
  <header class="top">
    <div class="row"><a href="/" class="marca" title="Menú"><img src="/img/logo.png" alt="Enclocha 2" class="logo-mini" /></a><a href="/" class="back">← Menú</a><h1>📋 Pedidos</h1></div>
    <div class="row">
      <span class="user-pill">👤 <span id="yo"></span></span>
      <button class="link" data-qr-grande>📲 QR</button>
      <button class="link" id="btnSonido">🔔 ON</button>
      <a href="/tomar">+ Nuevo</a>
    </div>
  </header>

  <main>
    <div id="aviso"></div>
    <div class="pausa" id="pausa" hidden></div>
    <div class="resumen" id="resumen"></div>
    <div class="status" id="status"><span class="dot"></span>Conectando...</div>
    <div class="cols">
      <div class="col new"><h2>Nuevos <span class="badge" id="cNuevo">0</span></h2><div id="lNuevo"></div></div>
      <div class="col prep"><h2>En preparación <span class="badge" id="cPrep">0</span></h2><div id="lPrep"></div></div>
      <div class="col done"><h2>Entregados hoy <span class="badge" id="cDone">0</span></h2><div id="lDone"></div></div>
    </div>
  </main>

  <div class="overlay" id="overlay">
    <div class="box">
      <div style="font-size:3rem">🔔</div>
      <h2>Activar sonido</h2>
      <p>El navegador exige un toque para poder sonar cuando llegue un pedido.</p>
      <button class="btn" id="activar">Activar y abrir pedidos</button>
    </div>
  </div>

  <!-- Cobro por transferencia: primero el QR -->
  <div class="modal" id="modalQR">
    <div class="box">
      <h3>📲 Cobrar por transferencia · <span id="mqNombre"></span></h3>
      <p class="hint" id="mqDet" style="margin:0"></p>
      <div id="mqQR"></div>
      <button class="btn" id="mqSi">✅ Ya transfirió · marcar pagado</button>
      <button class="btn ghost" id="mqNo">Cancelar</button>
    </div>
  </div>

  <!-- Confirmación de cancelar (sin alert del navegador) -->
  <div class="modal" id="modalCancelar">
    <div class="box">
      <h3>¿Cancelar el pedido <span id="mcNum"></span>?</h3>
      <div class="g2">
        <button class="btn ghost" id="mcNo">No</button>
        <button class="btn" id="mcSi" style="background:#c3293f">Sí, cancelar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { pesos, vistaItem, METODOS_PAGO, agruparCuentas, cuentaDe } from '/catalog.js';
    import { requerirSesion, api, traerPedidos, leerQR, htmlQR, enHorarioOperacion, avisoHorario, puede } from '/sesion.js';
    import { hoy, inicioJornada } from '/fechas.js';

    const $ = (s) => document.querySelector(s);
    const POLL_MS = 4000;
    const estado = { rev: null, pedidos: [] };
    let conocidos = null;
    let pedidos = [];
    let sonidoOn = true;
    try { sonidoOn = localStorage.getItem('sonido') !== 'off'; } catch {}
    let ctx = null;
    let pendientes = 0;

    await requerirSesion('pedidos', 'cobrar');

    // ---------- Sonido ----------
    function tono(freq, inicio, dur, vol = 0.35) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, ctx.currentTime + inicio);
      g.gain.linearRampToValueAtTime(vol, ctx.currentTime + inicio + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + inicio + dur);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + inicio); o.stop(ctx.currentTime + inicio + dur + 0.05);
    }
    function sonar() {
      if (!sonidoOn || !ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      [0, 0.9].forEach((t) => { tono(1046, t, 0.45); tono(784, t + 0.25, 0.6); });
      navigator.vibrate?.([200, 100, 200]);
    }
    $('#activar').addEventListener('click', () => {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      tono(880, 0, 0.2, 0.2);
      $('#overlay').remove();
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    });
    const pintarSonido = () => ($('#btnSonido').textContent = sonidoOn ? '🔔 ON' : '🔕 OFF');
    $('#btnSonido').addEventListener('click', () => {
      sonidoOn = !sonidoOn;
      try { localStorage.setItem('sonido', sonidoOn ? 'on' : 'off'); } catch {}
      pintarSonido();
      if (sonidoOn && ctx) tono(880, 0, 0.2, 0.2);
    });
    pintarSonido();

    // ---------- Datos ----------
    async function cargar() {
      try {
        const hayCambios = await traerPedidos(estado);
        $('#status').className = 'status';
        $('#status').innerHTML = enHorarioOperacion() ? `<span class="dot"></span>En línea · ${new Date().toLocaleTimeString('es-CO')}` : `🌙 Revisado a las ${new Date().toLocaleTimeString('es-CO')}`;
        if (!hayCambios) return;
        pedidos = estado.pedidos;
        $('#aviso').innerHTML = estado.persistente ? '' :
          '<div class="warnbar">⚠️ Sin base de datos conectada: los pedidos se pueden perder. Conecta Upstash Redis en Vercel (ver README).</div>';

        const ids = new Set(pedidos.map((p) => p.id));
        let nuevos = [];
        if (conocidos) nuevos = pedidos.filter((p) => !conocidos.has(p.id) && p.estado === 'nuevo');
        conocidos = ids;

        render(new Set(nuevos.map((p) => p.id)));
        if (nuevos.length) avisar(nuevos);
      } catch {
        $('#status').className = 'status off';
        $('#status').innerHTML = '<span class="dot"></span>Sin conexión, reintentando...';
      }
    }

    function avisar(nuevos) {
      sonar();
      if (document.hidden) {
        pendientes += nuevos.length;
        document.title = `(${pendientes}) ¡Nuevo pedido! · Granizados`;
      }
      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
        nuevos.forEach((p) => new Notification(`Pedido #${p.numero} · ${p.cliente}`, { body: `Tomó ${p.tomadoPor} · ${pesos(p.total)}` }));
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { pendientes = 0; document.title = 'Granizados · Pedidos'; }
    });

    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const hora = (t) => new Date(t).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    const metodo = (id) => METODOS_PAGO.find((m) => m.id === id);
    // "Hoy" = la jornada en curso (de 6 a. m. a 6 a. m.): a la 1 a. m. sigue contando la jornada anterior
    const inicioHoy = () => inicioJornada(hoy());

    const ACCIONES = {
      encamino: 'Despachó',
      preparando: 'Preparó', entregado: 'Entregó', cancelado: 'Canceló', nuevo: 'Devolvió',
      pagado: 'Cobró', 'pago-deshecho': 'Deshizo cobro',
    };

    let cuentasMap = new Map();

    function bloquePago(p) {
      const pg = p.pago || {};
      const c = cuentasMap.get(cuentaDe(p));
      const enCuenta = c && c.pedidos.filter((x) => x.estado !== 'cancelado').length > 1;
      const lineaCuenta = enCuenta
        ? `<div class="pago cuenta-linea">🔗 Cuenta de ${esc(p.cliente)}: ${c.pedidos.filter((x) => x.estado !== 'cancelado').map((x) => '#' + x.numero).join(' + ')}${c.pendiente ? ` · por cobrar <b>${pesos(c.pendiente)}</b>` : ' · pagada'}</div>` : '';
      if (pg.pagado) {
        const m = metodo(pg.metodo);
        return lineaCuenta + `<div class="pago ok"><span>✅ Pagado · ${m?.icono} ${m?.nombre} · cobró ${esc(pg.cobradoPor)}</span>
          ${puede('cobrar') ? `<button class="undo" data-id="${p.id}" data-despagar="1">deshacer</button>` : ''}</div>`;
      }
      const botones = !puede('cobrar') ? '' : METODOS_PAGO.map((m) =>
        `<button class="${pg.metodo === m.id ? 'sug' : ''}" data-id="${p.id}" data-cobrar="${m.id}" title="${enCuenta ? 'Cobra toda la cuenta' : ''}">Cobrado${enCuenta ? ' todo' : ''} ${m.icono}</button>`).join('');
      return lineaCuenta + (pg.ahora
        ? `<div class="pago barra"><span>💰 Paga en barra · ${metodo(pg.metodo)?.icono} ${metodo(pg.metodo)?.nombre}</span><div class="cobrar">${botones}</div></div>`
        : `<div class="pago despues"><span>${p.agregadoACuenta ? '➕ Agregado a la cuenta' : '⏳ Paga después'}</span><div class="cobrar">${botones}</div></div>`);
    }

    function tarjeta(p, flash) {
      const vistas = p.items.map(vistaItem);
      const grs = vistas.filter((d) => d.esGranizado).map((d) =>
        `<div class="gr"><span class="t">🍧 ${d.cantidad}× ${esc(d.tam)}</span> · ${d.sabores.map(esc).join(' + ')}<br>
          ${d.incluidos.length ? '🍬 ' + d.incluidos.map(esc).join(', ') : '🍬 Sin toppings'}<br>
          ${d.adicionales.length ? '➕ <b>' + d.adicionales.map(esc).join(', ') + '</b><br>' : ''}
          ${d.nota ? '📝 <i>' + esc(d.nota) + '</i>' : ''}</div>`).join('');
      const otros = vistas.filter((d) => !d.esGranizado);
      const bebidas = otros.length ? `<div class="gr">${otros.map((d) =>
        `<div><span class="t">${esc(d.icono || '🛒')} ${d.cantidad}×</span> ${esc(d.nombre)}${d.nota ? ' · 📝 <i>' + esc(d.nota) + '</i>' : ''}</div>`).join('')}</div>` : '';

      const esDom = p.tipo === 'domicilio';
      const d = p.domicilio || {};
      const domBox = esDom ? `<div class="dom-box">
          📞 <a href="tel:${esc(d.telefono)}">${esc(d.telefono)}</a> · <a href="https://wa.me/57${esc(d.telefono)}" target="_blank" rel="noopener">WhatsApp</a><br>
          📍 <b>${esc(d.direccion)}</b>${d.barrio ? ' · ' + esc(d.barrio) : ''}${d.referencia ? `<br>🏠 ${esc(d.referencia)}` : ''}
          ${d.ubicacion ? `<br>🗺️ <a href="https://www.google.com/maps/dir/?api=1&destination=${d.ubicacion.lat},${d.ubicacion.lng}" target="_blank" rel="noopener">Cómo llegar</a> · <a href="https://www.google.com/maps?q=${d.ubicacion.lat},${d.ubicacion.lng}" target="_blank" rel="noopener">Ver en mapa</a>${d.km != null ? ` · ${String(d.km).replace('.', ',')} km` : ''}` : d.zona ? `<br>🗺️ Zona: ${esc(d.zona)}` : ''}
          ${d.nota ? `<br>📝 ${esc(d.nota)}` : ''}
          <br>${p.pago?.metodo === 'transferencia' ? '📲 Paga por transferencia' : `💵 Paga en efectivo${d.pagaCon ? ` con <b>${pesos(d.pagaCon)}</b> → llevar vueltas de <b>${pesos(d.pagaCon - p.total)}</b>` : ''}`}
        </div>` : '';

      let acts = '';
      if (p.estado === 'nuevo') acts = `<button data-id="${p.id}" data-e="preparando">Preparar</button><button class="ok" data-id="${p.id}" data-e="entregado">Entregar</button><button class="no" data-id="${p.id}" data-cancelar="1" title="Cancelar">✕</button>`;
      if (p.estado === 'preparando') acts = esDom
        ? `<button class="back" data-id="${p.id}" data-e="nuevo" title="Devolver">↩</button><button class="sale" data-id="${p.id}" data-e="encamino">🛵 Salió</button>`
        : `<button class="back" data-id="${p.id}" data-e="nuevo" title="Devolver">↩</button><button class="ok" data-id="${p.id}" data-e="entregado">Entregado ✔</button>`;
      if (p.estado === 'encamino') acts = `<button class="back" data-id="${p.id}" data-e="preparando" title="Devolver">↩</button><button class="ok" data-id="${p.id}" data-e="entregado">✅ Entregado</button>`;
      if (p.estado === 'entregado') acts = `<button class="back" data-id="${p.id}" data-e="preparando">↩ Devolver</button>`;

      const hist = (p.historial || []).filter((h) => h.accion !== 'tomado')
        .map((h) => `${ACCIONES[h.accion] || h.accion} ${esc(h.usuario)} ${hora(h.en)}`).join(' · ');

      const n = p.items.reduce((s, i) => s + i.cantidad, 0);
      // Botones según permisos
      if (!puede('pedidos')) acts = acts.replace(/<button[^>]*data-e="(?!cancelado)[^"]*"[^>]*>.*?<\/button>/g, '');
      if (!puede('cancelar')) acts = acts.replace(/<button[^>]*data-cancelar[^>]*>.*?<\/button>/g, '');
      return `<div class="ped ${flash ? 'flash' : ''} ${p.estado === 'encamino' ? 'encamino' : ''}">
        <div class="head"><span class="num">#${p.numero}</span><span class="hora">${hora(p.creado)}</span></div>
        <div class="cli">👤 ${esc(p.cliente)}${esDom ? '<span class="dom-tag">🛵 DOMICILIO</span>' : ''} <span class="hint">· ${n} producto${n === 1 ? '' : 's'}</span>${p.estado === 'encamino' ? ' <span class="dom-tag">EN CAMINO</span>' : ''}</div>
        ${domBox}
        <div class="meta">✍️ Tomó: <b>${esc(p.tomadoPor || '—')}</b></div>
        ${bloquePago(p)}
        ${grs}${bebidas}${d.costo ? `<div class="gr">🛵 Domicilio · ${pesos(d.costo)}</div>` : ''}
        <div class="total" style="font-size:1.1rem;margin:8px 0 0"><span>Total</span><span>${pesos(p.total)}</span></div>
        <div class="acts">${acts}</div>
        ${hist ? `<div class="hist">${hist}</div>` : ''}
      </div>`;
    }

    function render(flashIds = new Set()) {
      cuentasMap = new Map(agruparCuentas(pedidos).map((c) => [c.id, c]));
      const hoy = inicioHoy();
      const asc = (a, b) => a.creado - b.creado;
      const nuevos = pedidos.filter((p) => p.estado === 'nuevo').sort(asc);
      const prep = pedidos.filter((p) => p.estado === 'preparando' || p.estado === 'encamino').sort(asc);
      const done = pedidos.filter((p) => p.estado === 'entregado' && p.creado >= hoy);

      const vacio = '<div class="empty">—</div>';
      $('#lNuevo').innerHTML = nuevos.map((p) => tarjeta(p, flashIds.has(p.id))).join('') || vacio;
      $('#lPrep').innerHTML = prep.map((p) => tarjeta(p)).join('') || vacio;
      $('#lDone').innerHTML = done.map((p) => tarjeta(p)).join('') || vacio;
      $('#cNuevo').textContent = nuevos.length;
      $('#cPrep').textContent = prep.length;
      $('#cDone').textContent = done.length;

      // Resumen del día (sin cancelados)
      const delDia = pedidos.filter((p) => p.creado >= hoy && p.estado !== 'cancelado');
      const suma = (f) => delDia.filter(f).reduce((s, p) => s + p.total, 0);
      const ef = suma((p) => p.pago?.pagado && p.pago.metodo === 'efectivo');
      const tr = suma((p) => p.pago?.pagado && p.pago.metodo === 'transferencia');
      const pend = suma((p) => !p.pago?.pagado);
      $('#resumen').innerHTML = `
        <div>Vendido hoy<b>${pesos(ef + tr + pend)}</b></div>
        <div>💵 Efectivo<b>${pesos(ef)}</b></div>
        <div>📲 Transferencia<b>${pesos(tr)}</b></div>
        <div>⏳ Por cobrar<b>${pesos(pend)}</b></div>`;
    }

    async function actualizar(id, cambios) {
      const p = pedidos.find((x) => x.id === id);
      if (p && cambios.estado) p.estado = cambios.estado;
      if (p && cambios.pago) p.pago = { ...p.pago, ...cambios.pago, cobradoPor: $('#yo').textContent };
      render();
      try { await api('/api/pedidos', { method: 'PATCH', body: JSON.stringify({ id, ...cambios }) }); } catch {}
      cargar();
    }

    async function cobrarCuenta(cuentaId, metodo) {
      const yo = $('#yo').textContent;
      pedidos.forEach((p) => { if (cuentaDe(p) === cuentaId && p.estado !== 'cancelado' && !p.pago?.pagado) p.pago = { ...p.pago, pagado: true, metodo, cobradoPor: yo }; });
      render();
      try { await api('/api/pedidos', { method: 'PATCH', body: JSON.stringify({ cobrarCuenta: cuentaId, metodo }) }); } catch {}
      cargar();
    }

    // Transferencia: mostrar el QR con el valor de la cuenta y confirmar cuando llegue
    let aCobrarQR = null;
    async function abrirQR(p) {
      aCobrarQR = cuentaDe(p);
      const c = cuentasMap.get(aCobrarQR);
      const monto = c ? c.pendiente : p.total;
      $('#mqNombre').textContent = p.cliente;
      $('#mqDet').textContent = c && c.abiertos.length > 1 ? `Cuenta con ${c.abiertos.length} pedidos: ${c.abiertos.map((x) => '#' + x.numero).join(', ')}` : `Pedido #${p.numero}`;
      $('#mqQR').innerHTML = '<p class="hint">Cargando QR...</p>';
      $('#modalQR').classList.add('show');
      $('#mqQR').innerHTML = htmlQR(await leerQR(), pesos(monto));
    }
    $('#mqNo').addEventListener('click', () => $('#modalQR').classList.remove('show'));
    $('#mqSi').addEventListener('click', () => { $('#modalQR').classList.remove('show'); if (aCobrarQR) cobrarCuenta(aCobrarQR, 'transferencia'); });

    let aCancelar = null;
    document.querySelector('main').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-id]');
      if (!b) return;
      const id = b.dataset.id;
      if (b.dataset.e) return actualizar(id, { estado: b.dataset.e });
      if (b.dataset.cobrar) {
        const p = pedidos.find((x) => x.id === id);
        if (b.dataset.cobrar === 'transferencia') return abrirQR(p);
        return cobrarCuenta(cuentaDe(p), b.dataset.cobrar);
      }
      if (b.dataset.despagar) return actualizar(id, { pago: { pagado: false } });
      if (b.dataset.cancelar) {
        aCancelar = id;
        $('#mcNum').textContent = '#' + (pedidos.find((p) => p.id === id)?.numero ?? '');
        $('#modalCancelar').classList.add('show');
      }
    });
    $('#mcNo').addEventListener('click', () => $('#modalCancelar').classList.remove('show'));
    $('#mcSi').addEventListener('click', () => {
      $('#modalCancelar').classList.remove('show');
      if (aCancelar) actualizar(aCancelar, { estado: 'cancelado' });
    });

    cargar();
    // Solo revisa pedidos nuevos en horario de operación (sigue aunque la pestaña esté en segundo plano, para que suene)
    setInterval(() => { if (enHorarioOperacion()) cargar(); }, POLL_MS);
    avisoHorario($('#pausa'), () => { estado.rev = null; cargar(); });
  </script>
</body>
</html>
