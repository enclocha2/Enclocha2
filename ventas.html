<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff3d7f" />
  <title>Granizados · Ventas</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body style="visibility:hidden">
  <header class="top">
    <div class="row"><a href="/" class="back">← Menú</a><h1>🧾 Ventas</h1></div>
    <div class="row"><a href="/reportes">📊 Reportes</a></div>
  </header>

  <main class="admin" style="max-width:1100px">
    <div class="card">
      <div class="chips" id="periodos" style="margin-bottom:10px"></div>
      <div class="filtro-fechas">
        <span class="hint">Desde</span><input class="field" type="date" id="desde">
        <span class="hint">hasta</span><input class="field" type="date" id="hasta">
        <button class="mini" id="aplicar">Ver</button>
      </div>
      <div class="row">
        <div class="chips" id="metodos"></div>
        <input class="field" id="buscar" placeholder="🔍 Cliente, producto, # pedido..." style="flex:1;min-width:200px">
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0" id="titulo">Ventas</h2>
        <button class="mini" id="descargar">⬇️ Descargar para Excel</button>
      </div>
      <div class="tabla-wrap"><table class="tabla" id="tabla"></table></div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { pesos } from '/catalog.js';
    import { requerirSesion, api, esc, toast } from '/sesion.js';
    import { hoy, sumarDias, inicioSemana, inicioMes, finMes, sumarMeses, fechaHora, fechaLarga } from '/fechas.js';
    import { normalizar } from '/catalog.js';

    const $ = (s) => document.querySelector(s);
    const { admin } = await requerirSesion();
    if (!admin) { document.querySelector('main').innerHTML = '<div class="card empty">No tienes permiso para ver las ventas.</div>'; throw 0; }

    const H = hoy();
    const PERIODOS = [
      ['hoy', 'Hoy', H, H],
      ['ayer', 'Ayer', sumarDias(H, -1), sumarDias(H, -1)],
      ['semana', 'Esta semana', inicioSemana(H), H],
      ['mes', 'Este mes', inicioMes(H), H],
      ['mespasado', 'Mes pasado', sumarMeses(H, -1), finMes(sumarMeses(H, -1))],
    ];
    const METODOS = [['todos', 'Todos'], ['efectivo', '💵 Efectivo'], ['transferencia', '📲 Transferencia']];
    let periodo = 'hoy', metodo = 'todos', ventas = [];

    function pintarFiltros() {
      $('#periodos').innerHTML = PERIODOS.map(([id, n]) => `<button class="chip ${periodo === id ? 'on' : ''}" data-p="${id}">${n}</button>`).join('');
      $('#metodos').innerHTML = METODOS.map(([id, n]) => `<button class="chip ${metodo === id ? 'on' : ''}" data-m="${id}">${n}</button>`).join('');
    }

    async function cargar() {
      const desde = $('#desde').value, hasta = $('#hasta').value;
      $('#tabla').innerHTML = '<tr><td class="empty">Cargando...</td></tr>';
      try {
        ({ ventas } = await api(`/api/ventas?desde=${desde}&hasta=${hasta}`));
        ventas.sort((a, b) => b.pa - a.pa);
        $('#titulo').textContent = desde === hasta ? fechaLarga(desde) : `${fechaLarga(desde)} → ${fechaLarga(hasta)}`;
        render();
      } catch (e) { toast(e.message, true); $('#tabla').innerHTML = ''; }
    }

    const filtradas = () => {
      const q = normalizar($('#buscar').value);
      return ventas.filter((v) => (metodo === 'todos' || v.m === metodo) &&
        (!q || normalizar(`${v.c} #${v.n} ${v.it.map((i) => i[0]).join(' ')} ${v.u} ${v.cb}`).includes(q)));
    };

    function render() {
      const lista = filtradas();
      const suma = (f) => lista.filter(f).reduce((s, v) => s + v.t, 0);
      const total = suma(() => true), ef = suma((v) => v.m === 'efectivo'), tr = suma((v) => v.m === 'transferencia');
      const pct = (x) => (total ? Math.round((x / total) * 100) : 0) + '%';
      $('#kpis').innerHTML = `
        <div class="kpi"><span>Total vendido</span><b>${pesos(total)}</b><small>${lista.length} venta${lista.length === 1 ? '' : 's'}</small></div>
        <div class="kpi"><span class="metodo m-efectivo"><i></i>Efectivo</span><b>${pesos(ef)}</b><small>${pct(ef)}</small></div>
        <div class="kpi"><span class="metodo m-transferencia"><i></i>Transferencia</span><b>${pesos(tr)}</b><small>${pct(tr)}</small></div>
        <div class="kpi"><span>Ticket promedio</span><b>${pesos(lista.length ? Math.round(total / lista.length) : 0)}</b></div>`;

      $('#tabla').innerHTML = lista.length ? `
        <thead><tr><th>Pagado</th><th>#</th><th>Cliente</th><th>Productos</th><th>Método</th><th>Tomó / Cobró</th><th class="num">Total</th></tr></thead>
        <tbody>${lista.map((v) => `<tr>
          <td style="white-space:nowrap">${fechaHora(v.pa)}</td>
          <td>#${v.n}</td>
          <td><b>${esc(v.c)}</b></td>
          <td>${v.it.map((i) => `${i[1]}× ${esc(i[0])}`).join('<br>')}</td>
          <td><span class="metodo m-${v.m}"><i></i>${v.m === 'efectivo' ? 'Efectivo' : 'Transferencia'}</span></td>
          <td class="hint">${esc(v.u)} / ${esc(v.cb)}</td>
          <td class="num"><b>${pesos(v.t)}</b></td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="6"><b>Total</b></td><td class="num"><b>${pesos(total)}</b></td></tr></tfoot>`
        : '<tr><td class="empty">No hay ventas en este periodo</td></tr>';
    }

    // CSV con ; y BOM para que Excel en español lo abra bien
    $('#descargar').addEventListener('click', () => {
      const lista = filtradas();
      if (!lista.length) return toast('No hay ventas para descargar', true);
      const c = (x) => `"${String(x ?? '').replace(/"/g, '""')}"`;
      const filas = [['Fecha pago', 'Pedido', 'Cliente', 'Productos', 'Método', 'Tomó', 'Cobró', 'Total']]
        .concat(lista.map((v) => [fechaHora(v.pa), v.n, v.c, v.it.map((i) => `${i[1]}x ${i[0]}`).join(' | '), v.m, v.u, v.cb, v.t]));
      const csv = '﻿' + filas.map((f) => f.map(c).join(';')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = `ventas_${$('#desde').value}_a_${$('#hasta').value}.csv`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });

    document.querySelector('main').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.p) {
        periodo = b.dataset.p;
        const [, , d, h] = PERIODOS.find((x) => x[0] === periodo);
        $('#desde').value = d; $('#hasta').value = h;
        pintarFiltros(); cargar();
      }
      if (b.dataset.m) { metodo = b.dataset.m; pintarFiltros(); render(); }
    });
    $('#aplicar').addEventListener('click', () => { periodo = ''; pintarFiltros(); cargar(); });
    $('#buscar').addEventListener('input', render);

    $('#desde').value = H; $('#hasta').value = H;
    pintarFiltros(); cargar();
  </script>
</body>
</html>
