<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff3d7f" />
  <title>Granizados · Menú</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body style="visibility:hidden">
  <header class="top">
    <h1>🍧 Granizados</h1>
    <div class="row">
      <span class="user-pill">👤 <span id="yo"></span></span>
      <button class="link" id="salir">Salir</button>
    </div>
  </header>

  <main class="menu">
    <p class="saludo" id="saludo"></p>

    <div class="tiles">
      <a class="tile t-tomar" href="/tomar">
        <span class="ico">🧾</span>
        <strong>Tomar pedido</strong>
        <span>Granizados, cervezas y licor</span>
      </a>
      <a class="tile t-pedidos" href="/pedidos">
        <span class="ico">📋</span>
        <strong>Pedidos</strong>
        <span id="tPedidos">Ver y despachar pedidos</span>
        <em class="cnt" id="cntNuevos" hidden></em>
      </a>
      <a class="tile t-sabores solo-admin" href="/productos#sabores">
        <span class="ico">🍧</span>
        <strong>Sabores disponibles</strong>
        <span id="tSabores">Escoge qué sabores se venden</span>
      </a>
      <a class="tile t-productos solo-admin" href="/productos#productos">
        <span class="ico">🛠️</span>
        <strong>Productos y precios</strong>
        <span id="tProductos">Agregar, quitar, precios y categorías</span>
      </a>
    </div>

    <h3 class="sub">Hoy</h3>
    <div class="resumen" id="resumen"><div>Cargando...</div></div>
  </main>

  <script type="module">
    import { pesos } from '/catalog.js';
    import { requerirSesion, api } from '/sesion.js';

    const $ = (s) => document.querySelector(s);
    const { usuario, admin } = await requerirSesion();

    const h = new Date().getHours();
    $('#saludo').textContent = `${h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'}, ${usuario} 👋`;
    if (!admin) document.querySelectorAll('.solo-admin').forEach((e) => e.remove());

    async function cargar() {
      try {
        const [{ pedidos }, { config }] = await Promise.all([api('/api/pedidos'), api('/api/catalogo')]);
        const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
        const delDia = pedidos.filter((p) => p.creado >= hoy.getTime() && p.estado !== 'cancelado');
        const nuevos = pedidos.filter((p) => p.estado === 'nuevo').length;
        const prep = pedidos.filter((p) => p.estado === 'preparando').length;
        const suma = (f) => delDia.filter(f).reduce((s, p) => s + p.total, 0);

        $('#cntNuevos').hidden = !nuevos;
        $('#cntNuevos').textContent = nuevos;
        $('#tPedidos').textContent = nuevos || prep ? `${nuevos} nuevos · ${prep} en preparación` : 'Sin pedidos pendientes';

        const sab = config.sabores.filter((s) => s.activo).length;
        const sinPrecio = config.productos.filter((p) => p.activo && !p.precio).length;
        if ($('#tSabores')) $('#tSabores').textContent = `${sab} de ${config.sabores.length} disponibles`;
        if ($('#tProductos')) $('#tProductos').innerHTML = sinPrecio
          ? `<b class="alerta">⚠️ ${sinPrecio} productos sin precio</b>` : `${config.productos.length} productos`;

        $('#resumen').innerHTML = `
          <div>Pedidos<b>${delDia.length}</b></div>
          <div>Vendido<b>${pesos(suma(() => true))}</b></div>
          <div>💵 Efectivo<b>${pesos(suma((p) => p.pago?.pagado && p.pago.metodo === 'efectivo'))}</b></div>
          <div>📲 Transferencia<b>${pesos(suma((p) => p.pago?.pagado && p.pago.metodo === 'transferencia'))}</b></div>
          <div>⏳ Por cobrar<b>${pesos(suma((p) => !p.pago?.pagado))}</b></div>`;
      } catch {}
    }
    cargar();
    setInterval(cargar, 10000);
  </script>
</body>
</html>
