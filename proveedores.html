<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a0b2e" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/img/icon-64.png" />
  <link rel="apple-touch-icon" href="/img/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Enclocha 2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" />
    <title>Enclocha 2 · Proveedores</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body style="visibility:hidden">
  <header class="top">
    <div class="row"><a href="/" class="marca" title="Menú"><img src="/img/logo.png" alt="Enclocha 2" class="logo-mini" /></a><a href="/" class="back">← Menú</a><h1>🚚 Proveedores</h1></div>
    <div class="row"><a href="/compras">🛒 Compras</a></div>
  </header>

  <main class="admin" style="max-width:900px">
    <section class="card" id="formCard">
      <h2 id="formTitulo">➕ Nuevo proveedor</h2>
      <p class="hint" style="margin-top:0">Solo los proveedores fijos (con NIT). Lo que se compra en la tienda de barrio no necesita registro.</p>
      <form id="fProv" class="form-compra">
        <label class="campo"><span>Nombre o razón social</span><input class="field" name="nombre" maxlength="80" required placeholder="Ej: Distribuidora La Montaña S.A.S."></label>
        <label class="campo"><span>NIT</span><input class="field" name="nit" maxlength="20" required inputmode="numeric" placeholder="Ej: 900123456-7"></label>
        <label class="campo"><span>Teléfono (opcional)</span><input class="field" name="telefono" maxlength="20" inputmode="tel"></label>
        <label class="campo"><span>Contacto / vendedor (opcional)</span><input class="field" name="contacto" maxlength="60"></label>
        <label class="campo ancho"><span>Nota (opcional)</span><input class="field" name="nota" maxlength="120" placeholder="Ej: viene los martes, se le paga por transferencia"></label>
        <div class="campo ancho row acciones-form">
          <button class="btn" id="btnGuardar">💾 Guardar proveedor</button>
          <button class="btn ghost" type="button" id="btnCancelar" hidden>Cancelar edición</button>
        </div>
        <div class="error" id="fError"></div>
      </form>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px;gap:8px">
        <h2 style="margin:0">🚚 Proveedores fijos</h2>
        <input class="field" id="buscar" placeholder="🔍 Buscar nombre o NIT" style="max-width:260px">
      </div>
      <div class="tabla-wrap"><table class="tabla" id="tabla"></table></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { pesos, normalizar } from '/catalog.js';
    import { requerirSesion, api, esc, toast, puede } from '/sesion.js';
    import { hoy, sumarMeses } from '/fechas.js';

    const $ = (s) => document.querySelector(s);
    await requerirSesion('compras', 'compras_editar');
    const editor = puede('compras');
    if (!editor) $('#formCard').hidden = true;
    const form = $('#fProv');
    let lista = [], editando = null, gastado = {};

    async function cargar() {
      try {
        const H = hoy();
        const [{ proveedores }, { compras }] = await Promise.all([
          api('/api/compras?r=proveedores'),
          api(`/api/compras?desde=${sumarMeses(H, -2)}&hasta=${H}`).catch(() => ({ compras: [] })),
        ]);
        lista = proveedores; gastado = {};
        for (const c of compras) if (c.proveedorId) { const g = gastado[c.proveedorId] ||= { total: 0, facturas: new Set() }; g.total += c.valor; g.facturas.add(c.factura || c.id); }
        render();
      } catch (e) { toast(e.message, true); }
    }
    function render() {
      const q = normalizar($('#buscar').value);
      const l = lista.filter((p) => !q || normalizar(`${p.nombre} ${p.nit} ${p.contacto}`).includes(q)).sort((a, b) => a.nombre.localeCompare(b.nombre));
      $('#tabla').innerHTML = l.length ? `<thead><tr><th>Proveedor</th><th>NIT</th><th>Contacto</th><th class="num">Últimos 3 meses</th>${editor ? '<th></th>' : ''}</tr></thead><tbody>` +
        l.map((p) => { const g = gastado[p.id]; return `<tr>
          <td><b>${esc(p.nombre)}</b>${p.nota ? `<br><span class="hint">📝 ${esc(p.nota)}</span>` : ''}</td>
          <td style="white-space:nowrap">${esc(p.nit)}</td>
          <td>${esc(p.contacto || '')}${p.telefono ? `<br><a href="tel:${esc(p.telefono)}">📞 ${esc(p.telefono)}</a>` : ''}${!p.contacto && !p.telefono ? '—' : ''}</td>
          <td class="num">${g ? `<b>${pesos(g.total)}</b><br><span class="hint">${g.facturas.size} compra${g.facturas.size === 1 ? '' : 's'}</span>` : '—'}</td>
          ${editor ? `<td style="white-space:nowrap"><button class="mini" data-edit="${p.id}">✏️</button> <button class="del" data-del="${p.id}">🗑</button></td>` : ''}
        </tr>`; }).join('') + '</tbody>'
        : `<tr><td class="empty">${lista.length ? 'Nada coincide con la búsqueda.' : 'Aún no hay proveedores. Registra el primero arriba.'}</td></tr>`;
    }
    function limpiar() { form.reset(); editando = null; $('#formTitulo').textContent = '➕ Nuevo proveedor'; $('#btnGuardar').textContent = '💾 Guardar proveedor'; $('#btnCancelar').hidden = true; $('#fError').textContent = ''; }
    $('#btnCancelar').addEventListener('click', limpiar);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const datos = Object.fromEntries(new FormData(form));
      try {
        ({ proveedores: lista } = await api('/api/compras?r=proveedores', { method: editando ? 'PUT' : 'POST', body: JSON.stringify(editando ? { id: editando, ...datos } : datos) }));
        toast(editando ? '✅ Proveedor actualizado' : `✅ ${datos.nombre} registrado`); limpiar(); render();
      } catch (err) { $('#fError').textContent = err.message; }
    });
    $('#tabla').addEventListener('click', async (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.edit) {
        const p = lista.find((x) => x.id === b.dataset.edit); editando = p.id;
        for (const k of ['nombre', 'nit', 'telefono', 'contacto', 'nota']) form[k].value = p[k] || '';
        $('#formTitulo').textContent = `✏️ Editando: ${p.nombre}`; $('#btnGuardar').textContent = '💾 Guardar cambios'; $('#btnCancelar').hidden = false;
        $('#formCard').scrollIntoView({ behavior: 'smooth' });
      }
      if (b.dataset.del) {
        if (!b.classList.contains('confirmar')) { b.classList.add('confirmar'); b.textContent = '¿Borrar?'; setTimeout(() => { b.classList.remove('confirmar'); b.textContent = '🗑'; }, 3000); return; }
        try { ({ proveedores: lista } = await api(`/api/compras?r=proveedores&id=${b.dataset.del}`, { method: 'DELETE' })); toast('Proveedor borrado (sus compras quedan igual)'); render(); } catch (err) { toast(err.message, true); }
      }
    });
    $('#buscar').addEventListener('input', render);
    cargar();
  </script>
</body>
</html>
